name: tasks-md
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: baldissaramatheus/tasks.md:latest
    container_name: tasks-md-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
      TITLE: ${APP_ORG_NAME:-My Tasks}
      LOCAL_IMAGES_CLEANUP_INTERVAL: ${LOCAL_IMAGES_CLEANUP_INTERVAL:-1440}
      CONTAINER_NAME: tasks-md-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '8080']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/data/tasks:/tasks'
      - './volumes/config/tasks:/config'
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.tasks-md-app.entrypoints=http'
      - 'traefik.http.routers.tasks-md-app.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.tasks-md-app.middlewares=tasks-md-app-https-redirect'
      - 'traefik.http.middlewares.tasks-md-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.tasks-md-app-secure.entrypoints=https'
      - 'traefik.http.routers.tasks-md-app-secure.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.tasks-md-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.tasks-md-app-secure.service=tasks-md-app'
      - 'traefik.http.services.tasks-md-app.loadbalancer.server.port=8080'
    networks:
      - tasks-md
      - traefik

networks:
  tasks-md:
    name: tasks-md
    external: false
  traefik:
    external: true
