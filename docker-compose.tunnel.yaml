name: tasks-md
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: baldissaramatheus/tasks.md:latest
    container_name: tasks-md-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
      TITLE: ${APP_ORG_NAME:-My Tasks}
      LOCAL_IMAGES_CLEANUP_INTERVAL: ${LOCAL_IMAGES_CLEANUP_INTERVAL:-1440}
      CONTAINER_NAME: tasks-md-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - './volumes/data/tasks:/tasks'
      - './volumes/config/tasks:/config'
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://tasks-md-app:8080'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - tasks-md
      - cloudflare

networks:
  tasks-md:
    name: tasks-md
    external: false
  cloudflare:
    external: true
